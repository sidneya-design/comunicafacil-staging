<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ComunicaFácil · Livros</title>
  <meta name="description" content="Leitor de livros EPUB e PDF" />
  <link rel="stylesheet" href="book-reader.css?v=24" />
  <!-- JSZip is required by epub.js when loading from ArrayBuffer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
</head>
<body>

<!-- Navbar Netflix-style -->
<header class="netflix-nav">
  <div class="nav-left">
    <h1 class="logo">ComunicaFácil <span>Livros</span></h1>
  </div>
  <div class="nav-right" style="display: flex; gap: 10px;">
    <button id="nav-upload-btn" class="nav-btn">Upload</button>
  </div>
</header>

<!-- Main Library View -->
<main id="library-view" class="netflix-main">
  
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-content">
      <h2>Sua Biblioteca</h2>
      <p>Leia seus PDFs e EPUBs favoritos diretamente no navegador.</p>
    </div>
  </div>

  <!-- Contexto de médico "dentro" de um paciente (Fase 6c) -->
  <div id="patient-context-banner" style="display:none; background:#fff3cd; color:#664d03; padding:10px 16px; border-radius:8px; margin: 0 5% 1rem; align-items:center; gap:10px;">
    <span id="patient-context-banner-text"></span>
  </div>

  <!-- Busca -->
  <div class="search-row">
    <input type="search" id="book-search" class="book-search" placeholder="Buscar por título..." aria-label="Buscar livro por título" />
  </div>

  <!-- Fileiras por gênero (populadas por JS) -->
  <div id="genre-rows-container"></div>
  <div id="empty-msg" class="empty-msg" style="display:none;">Nenhum livro encontrado.</div>

</main>

<!-- Upload Modal -->
<div id="upload-modal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <button id="close-modal" class="close-btn">&times;</button>
    <h2>Adicionar novo livro</h2>
    <div class="upload-dropzone" id="dropzone">
      <span class="upload-icon">📂</span>
      <p>Arraste um arquivo ou clique para selecionar</p>
      <span>EPUB ou PDF · até 200 MB</span>
      <input type="file" id="book-file" accept=".epub,.pdf" />
    </div>
    <label for="book-genre" class="form-label">Gênero</label>
    <select id="book-genre" class="form-input"></select>
    <button id="upload-btn" class="btn-primary" style="margin-top:1.2rem;">Enviar Livro</button>
    <div id="upload-status" class="upload-status"></div>
  </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <button id="close-edit-modal" class="close-btn">&times;</button>
    <h2>Editar livro</h2>
    <label for="edit-title-input" class="form-label">Título</label>
    <input type="text" id="edit-title-input" class="form-input" />
    <label for="edit-genre-select" class="form-label">Gênero</label>
    <select id="edit-genre-select" class="form-input"></select>
    <button id="edit-save-btn" class="btn-primary" style="margin-top:1.2rem;">Salvar</button>
    <div id="edit-status" class="upload-status"></div>
  </div>
</div>

<!-- Reader View (Hidden by default) -->
<div id="reader-view" class="reader-view" style="display:none;">
  <header class="reader-header">
    <button id="back-to-library" class="btn-icon">← Voltar</button>
    <div class="reader-title-block">
      <h2 id="reader-title">Lendo...</h2>
      <span id="reading-progress" class="reading-progress"></span>
    </div>

    <div class="reader-controls">
      <div class="font-size-stepper" role="group" aria-label="Tamanho da fonte">
        <button type="button" id="font-size-dec" class="stepper-btn" aria-label="Diminuir fonte">A−</button>
        <span id="font-size-label" class="stepper-label">Normal</span>
        <button type="button" id="font-size-inc" class="stepper-btn" aria-label="Aumentar fonte">A+</button>
      </div>
      <div class="theme-toggle" role="group" aria-label="Tema">
        <button type="button" id="theme-light-btn" class="theme-btn active" aria-label="Tema claro">☀️</button>
        <button type="button" id="theme-dark-btn" class="theme-btn" aria-label="Tema escuro">🌙</button>
      </div>
    </div>
  </header>

  <div class="viewer-wrapper" style="position: relative; flex: 1; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); padding: 1rem;">
    <button id="prev-page-btn" class="nav-page-btn" style="left: 1rem;">&#10094;</button>
    
    <div class="device-frame">
      <div id="viewer" class="device-screen viewer-container" style="width: 100%; height: 100%;"></div>
      <div class="device-logo">ComunicaFácil<span>Livros</span></div>
    </div>
    
    <button id="next-page-btn" class="nav-page-btn" style="right: 1rem;">&#10095;</button>
  </div>
</div>

<script src="book-reader.js?v=2218" type="module"></script>
</body>
</html>
